[package]
name = "sugarloaf"
version.workspace = true
edition.workspace = true
license.workspace = true
authors = ["Raphael Amorim <rapha850@gmail.com>"]
include = [
    "Cargo.toml",
    "src/**/*.ttf",
    "src/**/*.otf",
    "src/**/*.wgsl",
    "src/**/*.rs",
    "src/**/*.metal",
]
description = "Sugarloaf is Rio rendering engine, designed to be multiplatform. It is based on WebGPU, Rust library for Desktops and WebAssembly for Web (JavaScript). This project is created and maintained for Rio terminal purposes but feel free to use it."
documentation = "https://docs.rs/crate/sugarloaf/latest"
repository = "https://github.com/raphamorim/sugarloaf"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "wasm32-unknown-unknown",
]

[dependencies]
wgpu = { workspace = true }
bytemuck = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true, features = ["derive"] }
image_rs = { workspace = true }
unicode-width = { workspace = true }
unicode-segmentation = "1"
# UTR #51 emoji properties — used by `style_for_grapheme` font
# selection to distinguish VS-15/VS-16 selectors and default emoji
# presentation. Cascadia Code carries text glyphs for emoji-able
# characters like U+26A0 (⚠) and U+2705 (✅); without a presentation
# hint the cascade stops on the primary font and draws the text
# glyph (on terminals this surfaces as "Ê"-like silhouettes). This
# is the ecosystem equivalent of WezTerm's `Presentation::for_grapheme`.
unicode-properties = { version = "0.1", default-features = false, features = ["emoji"] }
guillotiere = "0.6.2"
rustc-hash = { workspace = true }
raw-window-handle = { workspace = true }
parking_lot = { workspace = true }
dashmap = { workspace = true }
approx = "0.5.1"
lru = "0.16.1"
smallvec = { workspace = true }
skrifa = "0.37.0"
halfbrown = "0.3.0"
half = "2.6.0"
num-traits = "0.2.19"
yazi = { version = "0.2.1", optional = true }
zeno = { version = "0.3.3", optional = true }
futures = { workspace = true }
tiny-skia = "0.12.0"
wide = "1.2.0"

thiserror = "2.0.1"

[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.32.0"
objc-rs = "0.2.8"
core-graphics-types = "0.2.0"
block = "0.1.6"

# CoreText font path is shared between macOS and iOS. iOS lacks Metal-direct
# texture sharing (Metal lives behind wgpu there) but the font subsystem
# (matching, glyph rasterization, family enumeration) goes straight through
# CoreText on both platforms — bypassing font-kit, which panics on iOS due
# to a `core-text` 20.x unwrap in font-trait extraction.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
core-graphics = "0.24.0"
core-text = "21.0.0"
core-foundation = "0.10.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1.10.0"
twox-hash = { version = "2.1.1", default-features = false, features = [
    "std",
    "xxhash64",
] }
wyhash = "0.5.0"
memmap2 = { workspace = true }
walkdir = "2.5.0"
softbuffer = "0.4"
ttf-parser = { version = "0.25.1", default-features = false, features = ["std", "opentype-layout", "apple-layout", "variable-fonts", "glyph-names"] }

# font-kit drives system font enumeration + matching on Linux/Windows.
# macOS still pulls it in because the `font/loader.rs` module compiles
# there even though CoreText handles matching at runtime. iOS is the
# only platform where loader is gated out of the build, because
# font-kit's `core-text` dependency panics on iOS (missing trait
# attributes on certain system fonts — CoreText path is used instead).
[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "ios")))'.dependencies]
font-kit = "0.14.3"

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
fontconfig-parser = { version = "0.5.8", default-features = false }

[dev-dependencies]
rio-window = { workspace = true }
png = "0.17.16"
deflate = "1.0.0"
criterion = { workspace = true }

[features]
default = ["scale", "render"]
scale = ["yazi", "zeno"]
render = ["scale", "zeno/eval"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
console_log = "0.2.2"
js-sys = "0.3.61"
wasm-bindgen = "0.2.87"
wasm-bindgen-futures = "0.4.34"
wasm-bindgen-test = "0.3.42"
